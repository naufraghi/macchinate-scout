<anvil-form container="HtmlTemplate" prop:html="@theme:standard-page.html">
  <anvil-component type="Label" name="app_title" prop:text="Macchinate Scout" prop:role="ride-app-title" container:slot="title"></anvil-component>
  <main class="rides-dashboard" anvil:name="content_panel" anvil:container:slot="default">
    <section class="rides-intro">
      <p class="rides-eyebrow">CLAN TORINO · PASSAGGI CONDIVISI</p>
      <h1>Macchinate organizzate per evento</h1>
      <p>Ogni attività ha la sua pagina, con orari standard di andata e ritorno e tutte le macchinate disponibili.</p>
    </section>

    <section aria-labelledby="events-board-title" class="rides-board-section">
      <div class="rides-board-heading">
        <div>
          <p class="rides-eyebrow">EVENTI</p>
          <h2 id="events-board-title">Trova la tua attività</h2>
        </div>
        <anvil-component type="Button" name="create_event_button" prop:text="Crea un evento" prop:role="ride-book-button"></anvil-component>
      </div>
      <anvil-component type="RepeatingPanel" name="events_panel" prop:item_template="M3_App.EventCard" prop:role="event-card-list"></anvil-component>
      <anvil-component type="Label" name="empty_state" prop:text="Non ci sono ancora eventi. Creane uno per raccogliere le macchinate della prossima attività." prop:role="rides-empty-state"></anvil-component>
    </section>
  </main>
  <anvil-component type="FlowPanel" name="navbar_links" prop:role="ride-login-bar" container:slot="nav-right">
    <anvil-component type="Label" name="user_label" prop:text="" prop:visible="false" prop:role="ride-user-label"></anvil-component>
    <anvil-component type="Button" name="login_button" prop:text="Accedi" prop:role="ride-login-button" prop:background="theme:On Secondary Container"></anvil-component>
  </anvil-component>
</anvil-form>
