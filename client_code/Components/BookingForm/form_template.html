  <anvil-component type="TextBox" name="phone_input" prop:placeholder="es. +39 333 1234567"></anvil-component>
  <anvil-component type="Label" name="email_label" prop:text="Email" prop:visible="false"></anvil-component>
  <anvil-component type="TextBox" name="email_input" prop:placeholder="nome@esempio.it" prop:visible="false"></anvil-component>
</anvil-form>
