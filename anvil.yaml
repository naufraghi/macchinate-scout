allow_embedding: false
db_schema:
  prenotazioni:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: tratta
      target: tratte
      type: link_single
    - admin_ui: {order: 1, width: 200}
      client_hidden: false
      name: passeggero
      target: users
      type: link_single
    - admin_ui: {order: 2, width: 200}
      client_hidden: false
      name: telefono_wa
      type: string
    server: full
    title: Prenotazioni
  tratte:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: conducente
      target: users
      type: link_single
    - admin_ui: {order: 1, width: 200}
      client_hidden: false
      name: nome_conducente
      type: string
    - admin_ui: {order: 2, width: 200}
      client_hidden: false
      name: tipo_tratta
      type: string
    - admin_ui: {order: 3, width: 200}
      client_hidden: false
      name: zona_partenza
      type: string
    - admin_ui: {order: 4, width: 200}
      client_hidden: false
      name: orario
      type: string
    - admin_ui: {order: 5, width: 200}
      client_hidden: false
      name: posti_totali
      type: number
    - admin_ui: {order: 6, width: 200}
      client_hidden: false
      name: posti_occupati
      type: number
    - admin_ui: {order: 7, width: 200}
      client_hidden: false
      name: stato
      type: string
    server: full
    title: Tratte
  tratte_contatti:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: tratta
      target: tratte
      type: link_single
    - admin_ui: {order: 1, width: 200}
      client_hidden: true
      name: telefono_wa
      type: string
    server: full
    title: Contatti Tratte
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: email
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: true
      name: enabled
      type: bool
    - admin_ui: {order: 2, width: 200}
      client_hidden: true
      name: last_login
      type: datetime
    - admin_ui: {order: 3, width: 200}
      client_hidden: true
      name: password_hash
      type: string
    - admin_ui: {order: 4, width: 200}
      client_hidden: true
      name: n_password_failures
      type: number
    - admin_ui: {order: 5, width: 200}
      client_hidden: true
      name: confirmed_email
      type: bool
    - admin_ui: {order: 6, width: 200}
      client_hidden: true
      name: remembered_logins
      type: simpleObject
    - admin_ui: {order: 7, width: 200}
      client_hidden: true
      name: signed_up
      type: datetime
    indexes: []
    server: full
    title: Users
dependencies: []
metadata: {description: App per fare le macchinate per andare in attività, logo_img: 'asset:clan-can-torino.png', title: Macchinate Scout}
name: Macchinate Scout
package_name: M3_App
renamed: true
runtime_options:
  client_version: '3'
  legacy_features: {bootstrap3: true, class_names: true}
  server_spec: {base: python314}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_remember_me: true, allow_signup: true, confirm_email: true, enable_automatically: true, remember_me_days: 30, use_email: true, use_token: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/anvil/email.yml
startup_form: Form1
